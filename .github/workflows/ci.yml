name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Core deps only: tests use a fake embedder, so no model downloads.
      - run: pip install pytest pandas numpy pyyaml pdfplumber
      - run: pip install -e . --no-deps
      - run: pytest -q
