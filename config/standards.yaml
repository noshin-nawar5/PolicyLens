standards:
  - id: pci-dss-4
    name: PCI DSS v4.0.1
    pdf: data/standards/PCI-DSS-v4_0_1.pdf
    output: data/processed/pci-dss-4.json
    include_top_level: ["6"]
    layout:
      left_col: [72, 293]   # x range in points of the Requirements column
      top: 108              # ignore running page header above this y
      bottom: 540           # ignore running footer below this y
      pages: [138, 164]     # PDF page numbers (1-based) holding Requirement 6
    noise_patterns:
      - '^Page \d+( of \d+)?$'